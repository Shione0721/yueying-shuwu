<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月影书屋 · made by 汐宁</title>
<style>

  :root{
    --pink:#d9a066; --purple:#8f86b8; --deep:#241a3d; --gold:#e0b96a;
    --cream:#f3ecd7; --line:#e8c9a0;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    color:#fff; overflow-x:hidden;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(143,134,184,.35), transparent 60%),
      radial-gradient(1000px 700px at 110% 20%, rgba(217,160,102,.30), transparent 60%),
      radial-gradient(900px 700px at 50% 120%, rgba(133,144,138,.18), transparent 60%),
      linear-gradient(160deg,#17112d 0%, #2c2052 45%, #3b2a62 100%);
    min-height:100vh;
  }
  #stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }

  .wrap{ position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:34px 22px 60px; }

  .header{ text-align:center; margin-bottom:8px; }
  .ribbon .title{
    font-size:40px; font-weight:900; letter-spacing:2px;
    background:linear-gradient(90deg,#e0b96a,#d9a066,#b8a6d9,#e0b96a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 24px rgba(217,160,102,.45);
  }
  .subtitle{ color:#e2d9ee; font-size:15px; margin-top:8px; letter-spacing:3px; opacity:.9; }
  .divider{ width:220px; height:2px; margin:18px auto 0;
    background:linear-gradient(90deg,transparent,#e8c9a0,transparent); }
  .mode-bar{ margin-top:14px; }
  .mode-toggle{ border:2px solid rgba(232,201,160,.45); background:rgba(240,234,246,.06); color:#e8c9a0;
    padding:8px 24px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:700;
    letter-spacing:2px; font-family:inherit; transition:.18s; }
  .mode-toggle:hover{ transform:translateY(-2px); border-color:#e0b96a; box-shadow:0 6px 16px rgba(217,160,102,.3); }
  .mode-hint{ margin-top:8px; font-size:12px; color:#8f86a8; letter-spacing:2px; text-align:center; }

  .main-area{ margin-top:26px; display:flex; flex-direction:column; align-items:center; }
  .stage{ perspective:1400px; }
  .tarot-card{
    width:270px; height:450px; position:relative; cursor:pointer;
    transform-style:preserve-3d; transition:transform .9s cubic-bezier(.34,1.4,.64,1);
    animation:floaty 4s ease-in-out infinite;
  }
  .tarot-card.flipped{ transform:rotateY(180deg); animation:none; }
  .tarot-card.shake{ animation:shake .6s ease-in-out; }
  @keyframes floaty{ 0%,100%{transform:translateY(0) rotateZ(-1deg);} 50%{transform:translateY(-12px) rotateZ(1deg);} }
  @keyframes shake{ 0%,100%{transform:rotateZ(0);} 20%{transform:rotateZ(-6deg);} 40%{transform:rotateZ(5deg);} 60%{transform:rotateZ(-4deg);} 80%{transform:rotateZ(3deg);} }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:20px; }
  .back{
    background:
      radial-gradient(circle at 50% 42%, rgba(224,185,106,.28), transparent 46%),
      linear-gradient(160deg,#3d2f66,#2c1f4e);
    border:3px solid var(--gold); box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 0 0 6px rgba(224,185,106,.12);
    display:flex; align-items:center; justify-content:center;
  }
  .back .back-inner{
    width:78%; height:84%; border:2px solid rgba(224,185,106,.6); border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  .back .moon{ font-size:64px; color:#e0b96a; text-shadow:0 0 20px rgba(224,185,106,.8); }
  .back .back-title{ font-size:22px; letter-spacing:4px; color:#e8c9a0; font-weight:700; }
  .back .back-tip{ font-size:12px; color:#a394c0; letter-spacing:2px; }
  .front{ transform:rotateY(180deg); background:#221733; box-shadow:0 14px 40px rgba(0,0,0,.55); }
  .front svg{ width:100%; height:100%; display:block; border-radius:20px; }
  .cardimg{ width:100%; height:100%; object-fit:cover; display:block; }
  .front .cardimg{ border-radius:20px; }
  .slot-card.reversed .cardimg{ transform:rotate(180deg); }

  .hint{ margin-top:20px; font-size:14px; color:#c5b8e0; letter-spacing:2px; opacity:.9; }

  .actions{ margin-top:16px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-size:15px; font-weight:700; letter-spacing:1px;
    padding:12px 26px; border-radius:999px; color:#3a2b5e;
    background:linear-gradient(135deg,#e0b96a,#d9a066);
    box-shadow:0 6px 18px rgba(217,160,102,.4);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s;
  }
  .btn:hover{ transform:translateY(-3px) scale(1.03); box-shadow:0 10px 24px rgba(217,160,102,.55); }
  .btn:active{ transform:scale(.96); }
  .btn.ghost{ background:rgba(255,255,255,.1); color:#e2d9ee; box-shadow:none; border:1px solid rgba(232,201,160,.4); }

  .reading{ margin-top:34px; display:none; }
  .reading.show{ display:block; animation:rise .7s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }
  .panel{
    background:rgba(36,26,61,.72); border:2px solid rgba(232,201,160,.28); border-radius:22px;
    padding:28px; backdrop-filter:blur(8px);
  }
  .panel-head{ display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
  .panel-card{ width:170px; height:283px; flex:0 0 auto; border-radius:14px; overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.5); }
  .panel-card svg{ width:100%; height:100%; display:block; }
  .panel-meta{ flex:1; min-width:260px; }
  .card-name{ font-size:28px; font-weight:900; }
  .card-name .en{ font-size:14px; color:#a99bd0; font-weight:600; margin-left:10px; letter-spacing:1px; }
  .tags{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
  .tag{ font-size:12px; padding:5px 14px; border-radius:999px; background:rgba(217,160,102,.18);
    border:1px solid rgba(217,160,102,.4); color:#e8c9a0; letter-spacing:1px; }
  .tag.pos{ color:#f0d9a0; background:rgba(224,185,106,.15); border-color:rgba(224,185,106,.45); }
  .meaning{ margin-top:18px; font-size:15px; line-height:1.9; color:#f2edf7; }

  .split{ margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:640px){ .split{ grid-template-columns:1fr; } }
  .side{ border-radius:16px; padding:18px 20px; }
  .side.up{ background:rgba(224,185,106,.12); border:1px solid rgba(224,185,106,.35); }
  .side.rev{ background:rgba(143,134,184,.16); border:1px solid rgba(143,134,184,.4); }
  .side h4{ font-size:16px; margin-bottom:10px; letter-spacing:2px; }
  .side.up h4{ color:#e0b96a; }
  .side.rev h4{ color:#b8a6d9; }
  .side p{ font-size:14px; line-height:1.85; color:#f0eaf6; }

  .aspects{ margin-top:22px; }
  .aspects h4{ font-size:16px; letter-spacing:2px; color:#e8c9a0; margin-bottom:14px; }
  .aspect-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media(max-width:720px){ .aspect-grid{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:440px){ .aspect-grid{ grid-template-columns:1fr; } }
  .asp{ background:rgba(240,234,246,.05); border:1px solid rgba(232,201,160,.22); border-radius:14px; padding:14px 16px; }
  .asp .ico{ font-size:18px; }
  .asp .k{ font-size:13px; font-weight:800; color:#e8c9a0; margin:6px 0 4px; letter-spacing:1px; }
  .asp .v{ font-size:13px; line-height:1.75; color:#ede6f5; }

  .regen{ margin-top:22px; text-align:center; }
  .date-line{ margin-top:10px; font-size:13px; color:#a394c0; letter-spacing:1px; }

  .codex{ margin-top:56px; }
  .codex h2{ text-align:center; font-size:24px; letter-spacing:3px; color:#e8c9a0; }
  .codex-grid{ margin-top:22px; display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; }
  .suit-title{ grid-column:1/-1; margin-top:14px; font-size:16px; font-weight:800; color:#e8c9a0; letter-spacing:2px; text-align:center; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .codex-card{ border-radius:14px; overflow:hidden; cursor:pointer; position:relative;
    box-shadow:0 6px 16px rgba(0,0,0,.4); transition:transform .18s ease, box-shadow .18s ease; }
  .codex-card:hover{ transform:translateY(-5px); box-shadow:0 12px 26px rgba(0,0,0,.55); }
  .codex-card svg{ width:100%; display:block; }
  .codex-card .label{ position:absolute; left:0; right:0; bottom:0; padding:6px 4px; text-align:center;
    font-size:12px; font-weight:700; background:linear-gradient(transparent, rgba(20,10,40,.85)); letter-spacing:1px; }

  .footer{ margin-top:50px; text-align:center; font-size:12px; color:#8f86a8; letter-spacing:2px; line-height:2; } .footer .credit{ font-size:11px; color:#7a7395; letter-spacing:1px; opacity:.9; }


  /* tab 导航 */
  .tabs{ display:flex; justify-content:center; gap:12px; margin-top:24px; }
  .tab{ border:2px solid rgba(232,201,160,.35); background:rgba(240,234,246,.05); color:#e2d9ee;
    padding:10px 30px; border-radius:999px; cursor:pointer; font-size:15px; font-weight:700;
    letter-spacing:2px; font-family:inherit; transition:.18s; }
  .tab:hover{ transform:translateY(-2px); }
  .tab.active{ background:linear-gradient(135deg,#e0b96a,#d9a066); color:#3a2b5e; border-color:transparent;
    box-shadow:0 6px 18px rgba(217,160,102,.4); }
  /* 占卜面板 */
  .divine-box{ margin-top:24px; background:rgba(36,26,61,.55); border:2px solid rgba(232,201,160,.22);
    border-radius:22px; padding:28px; }
  .divine-step h3{ font-size:17px; letter-spacing:2px; color:#e8c9a0; margin-bottom:14px; }
  .divine-step + .divine-step{ margin-top:24px; }
  .aspect-chips{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{ padding:10px 20px; border-radius:999px; cursor:pointer; border:2px solid rgba(232,201,160,.35);
    background:rgba(240,234,246,.05); color:#f0eaf6; font-size:14px; transition:.15s; }
  .chip:hover{ transform:translateY(-2px); border-color:#e0b96a; }
  .chip.sel{ background:linear-gradient(135deg,#e0b96a,#d9a066); color:#3a2b5e; border-color:transparent; font-weight:800; }
  .spread-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:12px; }
  .spread-card{ padding:14px 12px; border-radius:14px; cursor:pointer; text-align:center;
    background:rgba(240,234,246,.05); border:2px solid rgba(232,201,160,.22); transition:.15s; }
  .spread-card:hover{ transform:translateY(-3px); border-color:#b8a6d9; }
  .spread-card.sel{ border-color:#e0b96a; background:rgba(224,185,106,.14); }
  .spread-card .s-name{ font-weight:800; color:#e8c9a0; font-size:14px; }
  .spread-card .s-cards{ font-size:12px; color:#a99bd0; margin:5px 0 3px; }
  .spread-card .s-desc{ font-size:11px; color:#a394c0; line-height:1.5; }
  .divine-actions{ margin-top:26px; text-align:center; }
  .divine-title{ text-align:center; font-size:19px; font-weight:800; color:#f0d9a0; letter-spacing:2px; margin-bottom:16px; }
  .slots-grid{ display:grid; gap:14px; margin-top:16px; }
  .slots-grid.cols-1{ grid-template-columns:minmax(0,300px); justify-content:center; }
  .slots-grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .slots-grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  @media(max-width:920px){ .slots-grid.cols-3,.slots-grid.cols-4{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:540px){ .slots-grid.cols-3,.slots-grid.cols-4{ grid-template-columns:1fr; } }
  .slot{ background:rgba(240,234,246,.05); border:1px solid rgba(232,201,160,.22); border-radius:16px; padding:16px; }
  .slot-pos{ font-size:13px; font-weight:800; color:#e0b96a; letter-spacing:1px; margin-bottom:10px; }
  .slot-card{ width:150px; height:250px; margin:0 auto; border-radius:12px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,.45); }
  .slot-card svg{ width:100%; height:100%; display:block; transition:transform .8s ease; }
  .slot-card.reversed svg{ transform:rotate(180deg); }
  .slot-name{ text-align:center; font-size:16px; font-weight:800; margin-top:10px; color:#fff; }
  .rev-tag{ display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; margin-left:6px; }
  .rev-tag.up{ background:rgba(224,185,106,.25); color:#f0d9a0; }
  .rev-tag:not(.up){ background:rgba(143,134,184,.3); color:#b8a6d9; }
  .slot-read{ font-size:13px; line-height:1.8; color:#ede6f5; margin-top:8px; }
  .guide-box{ margin-top:20px; padding:16px 20px; border-radius:14px; background:rgba(224,185,106,.1);
    border:1px solid rgba(224,185,106,.3); font-size:14px; line-height:1.8; color:#f0d9a0; }

</style>
</head>
<body>

<div id="stars"></div>
<div class="wrap">
  <div class="header">
    <div class="ribbon"><span class="title">✨ 月影书屋 ✨</span></div>
    <div class="subtitle">— 聆听星月的声音 —</div>
    <div class="mode-bar"><button class="mode-toggle" id="btnMode" title="点击切换牌组模式">🔮 标准塔罗 · 78张 ⇄</button><div class="mode-hint">点击切换 22 大阿卡纳 / 78 标准塔罗</div></div>
    <div class="divider"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="daily">🌙 每日一签</button>
    <button class="tab" data-tab="divine">🔮 主题占卜</button>
  </div>

  <div id="dailyPanel">
    <div class="main-area">
      <div class="stage">
        <div class="tarot-card" id="tarot">
          <div class="face back">
            <div class="back-inner">
              <span class="moon">☾</span>
              <span class="back-title">今日塔罗</span>
              <span class="back-tip">轻触牌背 抽取今日指引</span>
            </div>
          </div>
          <div class="face front" id="faceBox"></div>
        </div>
      </div>
      <div class="hint" id="hint">👆 点一下牌背，抽取属于你今天的塔罗牌</div>
      <div class="actions" id="actions">
        <button class="btn ghost" id="btnAgain" style="display:none">🎲 再抽一张（娱乐）</button>
      </div>
    </div>
    <div class="reading" id="reading"></div>
  </div>

  <div id="divinePanel" style="display:none">
    <div class="divine-box">
      <div class="divine-step">
        <h3>① 选择你想占卜的方面</h3>
        <div class="aspect-chips" id="aspectChips"></div>
      </div>
      <div class="divine-step">
        <h3>② 选择一个牌阵</h3>
        <div class="spread-cards" id="spreadCards"></div>
      </div>
      <div class="divine-actions">
        <button class="btn" id="btnDivine">✨ 开始占卜</button>
      </div>
      <div class="divine-result" id="divineResult"></div>
    </div>
  </div>

  <div class="codex">
    <h2>✦ 牌意图鉴 ✦</h2>
    <div class="codex-grid" id="codexGrid"></div>
  </div>

  <div class="footer">
    每日一签 · 主题占卜 · <span id="footInfo">图鉴全览 78 张牌</span><br>
    占卜仅供娱乐，人生由你自己书写呀 ✧(≖ ◡ ≖✿)<br>
    <span class="credit">卡面图片来自《Mystical Manga Tarot》塔罗牌组（elvitarot.com），版权归原作者所有，仅供个人学习与展示</span>
  </div>
</div>

  { id:4, name:"皇帝", en:"The Emperor", num:"IV", keys:["秩序", "权威", "责任", "规划"],
    meaning:"原意：皇帝是权威、结构与对资源负责管理的象征，无论在家、组织还是更大的共同体中。他看重计划、逻辑，以及对资源的分派与保全。",

  { id:5, name:"教皇", en:"The Hierophant", num:"V", keys:["传统", "信念", "指引", "真实"],
    meaning:"原意：教皇是内在价值与外在行动之间的桥梁，教人如何真实地活。他指向教育、仪式、文化与信仰等传统结构，它们塑造着人的行为与承诺。",

    rev:"逆位：问自己——我活的是自己认定的真理，还是别人强加的？对传统的背离，究竟是叛逆，还是深思后的选择？",
    asp:{love:"传统而认真，感情易获得家人认可。",work:"体制内或稳定环境吃香，易被提携。",study:"循规蹈矩、有名师指点，稳步精进。",money:"按部就班、稳中有升，宜长线。",social:"受人尊重、尊师重道，口碑很好。",health:"规律作息、遵医嘱，身体无恙。"},

  { id:6, name:"恋人", en:"The Lovers", num:"VI", keys:["结合", "选择", "心灵", "渴望"],
    meaning:"原意：恋人牌是愚者与艰难抉择的相遇，尤其在爱情里，社会期望与个人渴望相互拉扯。有些决定没有逻辑上的标准答案，只能由心灵与灵魂来选。",
    up:"正位：头脑、心灵与外界压力在内心交战，而心灵才是最真实的向导。",

    asp:{love:"甜蜜升温、心灵相通，正是告白或更进一步的好时机。",work:"合作共赢、团队融洽，默契带来效率。",study:"找到志同道合的伙伴，协同进步。",money:"合作生财，签约前务必看清条款。",social:"关系和谐、桃花旺盛，人气高涨。",health:"身心愉悦，注意情绪起伏。"},

  { id:7, name:"战车", en:"The Chariot", num:"VII", keys:["行动", "掌控", "前进", "勇气"],
    meaning:"原意：战车宣告：即便自觉青涩笨拙，也到了执掌缰绳、向前迈进的时刻。行动先于完美——当你握住缰绳、开始检验身手，进步便已发生。",

    asp:{love:"主动追求、势不可挡，用真诚打动对方。",work:"披荆斩棘、达成目标，冲劲十足。",study:"全力以赴、冲刺高分，别松懈。",money:"进取生财、机会增多，忌冒进。",social:"强势有魅力，注意收敛锋芒。",health:"精力旺盛，记得劳逸结合。"},

  { id:8, name:"力量", en:"Strength", num:"VIII", keys:["勇气", "疗愈", "内在力量", "面对阴影"],
    meaning:"原意：力量牌是愚者觉醒的意志——他拒绝被命运摆布，开始正视外界的期待与内心溃烂已久的旧伤。它说的是面对阴影的艰难勇气：承认那些曾紧抓的信念已不再有用。",
    up:"正位：深入阴影去疗愈伤口、收回被否认的那部分自己，由此长出不可动摇的内在自信。",
    rev:"逆位：留意你的「投射」——你在他人身上看到的毛病，常常正映照着你自己未曾审视的恐惧与缺陷。",
    asp:{love:"温柔坚定、以心换心，感情细水长流。",work:"沉稳应对挑战、厚积薄发。",study:"持之以恒、攻克难关，慢即是快。",money:"量入为出、渐入佳境，守得住财。",social:"亲和有力、善解人意，很得人缘。",health:"身心强健，锻炼增强韧性。"},

  { id:9, name:"隐者", en:"The Hermit", num:"IX", keys:["内省", "独处", "真理", "审视"],
    meaning:"原意：隐者是在幻灭之后退离人群、重新审视信念、与自己的内心商谈。有限的内在之光只照亮下一步，却比外界灌输的世界观更真实。",
    up:"正位：外界的喧嚣——社会、亲友、兜售建议的人——给不了你真正需要的答案。停止输入，用你的心、脑与灵魂去质疑一切，只留下经得起检验的。",
    rev:"逆位：别用社交或他人的意见，来逃避那些你必须独自面对的想法。",
    asp:{love:"冷静审视、慢热专一，感情藏得深。",work:"深耕专业、独立完成，价值被看见。",study:"独自钻研、领悟深刻，适合攻克难点。",money:"节俭自足，暂不宜大额投资。",social:"享受独处、深交不多，但都真诚。",health:"注意作息，舒缓压力、别熬夜。"},

  { id:10, name:"命运之轮", en:"Wheel of Fortune", num:"X", keys:["转机", "循环", "选择", "觉醒"],
    meaning:"原意：命运之轮描绘那些重复的循环——即便渴望改变，仍被拉回熟悉而令人沮丧的老路。时间与际遇如轮转动，时好时坏；你无法左右轮盘抛出什么，却能左右自己如何回应。",

    rev:"逆位：诚实反思：你究竟卡在哪里，又在反复重演哪些模式？",
    asp:{love:"缘分悄然到来，转角就可能遇见对的人。",work:"时来运转、机遇敲门，大胆把握。",study:"豁然开朗，成绩虽有起伏整体向好。",money:"运势回升，或有意外之财，谨慎处置。",social:"结识贵人，人际关系迎来新变化。",health:"整体向好，注意小波动及时调整。"},

  { id:11, name:"正义", en:"Justice", num:"XI", keys:["公平", "因果", "承担", "真相"],
    meaning:"原意：正义教导我们，公平是复杂的——人的规则与业力法则都在左右结果。行动必有后果，意图决定你如何塑造未来。",
    up:"正位：人们正得到与自身行为相称的结果，尽管世俗的公正未必完美。应得的就坦然接受，行事正当就坚守立场，做错了就决心改过。",

    asp:{love:"真诚对等、坦诚相待，关系稳固。",work:"公平竞争、凭实力说话，结果公正。",study:"一分耕耘一分收获，别心存侥幸。",money:"收支平衡、按规矩办事，心安理得。",social:"公正客观、不偏不倚，赢得信赖。",health:"注意作息规律，让身心保持平衡。"},

  { id:13, name:"死神", en:"Death", num:"XIII", keys:["结束", "转变", "重生", "放下"],
    meaning:"原意：死神牌是深刻的蜕变——那些不再服务于你之物自然终结，为更真实的自己腾出重生之路。如同毛毛虫化蝶，旧身份被蜕去。",

    meaning:"原意：节制是对立面的和谐融合——内在清明，便能在自信与从容中前行。它把理性与直觉调和到恰到好处的比例，产生近乎神奇的成效。",
    up:"正位：信任你的内在声音，找到那个让一切行动与抉择都恰到好处、轻松完美的平衡点。",

    meaning:"原意：恶魔牌是受困于不健康、不真实的关系或习惯——它们抗拒改变。当你试图改变时，旧体系会拼命维系旧模式，翻出旧伤与冲动来考验你。",
    up:"正位：这些处境虽令人窒息，却也是礼物，能帮你坚定决定、巩固新习惯。你有挣脱的能力，尤其凭借决心与外部帮助。",

    meaning:"原意：高塔是因个人蜕变而触发的旧结构骤然崩塌，常发生在一段内心挣扎之后。混乱与失去虽痛，却为更健康的体系与新生长腾出了空间。",
    up:"正位：请放心——并非一切都会被摧毁，只有那些不再服务于你最高利益的部分。让拆解自然发生，抢救尚存之物，别制造戏剧、别自我破坏。",

    meaning:"原意：月亮是迷惘与幻象的时期——表象带有欺骗性，没有什么是表面所见。此时不能只信肉体的感官，须依靠精神与直觉；内在的恐惧与潜意识意象会浮出，甚至攫住你。",
    up:"正位：眼下不宜做重大决定，潜入表象之下调查，或耐心等待天亮带来清明。黑暗只是暂时的，守住你的指引之星，便不会惊慌。",

    meaning:"原意：太阳是清晰、成功，与历经艰难后因信任内心而结出的喜悦之果。这是温暖明亮的时期，成就有目共睹，生活丰盛充盈。",

var cardEl = document.getElementById("tarot");
var faceBox = document.getElementById("faceBox");
var hint = document.getElementById("hint");
var reading = document.getElementById("reading");
var btnAgain = document.getElementById("btnAgain");

var MODE = "full";
function getDeck(){ return MODE === "major" ? CARDS.slice(0, 22) : CARDS; }
function todayKey(){
  var d = new Date();
  var base = "tarot_" + d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return MODE === "major" ? (base + "_major") : base;
}
function pickCard(){ var deck = getDeck(); return deck[Math.floor(Math.random()*deck.length)]; }

function buildReading(card, isDaily){
  var tags = card.keys.map(function(k){ return '<span class="tag pos">' + k + '</span>'; }).join("");
  var aspects = [
    ["💕","爱情",card.asp.love],["💼","事业",card.asp.work],["📚","学业",card.asp.study],
    ["💰","财运",card.asp.money],["🤝","人际",card.asp.social],["🌿","健康",card.asp.health]
  ].map(function(a){ return '<div class="asp"><div class="ico">' + a[0] + '</div><div class="k">' + a[1] + '</div><div class="v">' + a[2] + '</div></div>'; }).join("");
  reading.innerHTML =
    '<div class="panel">' +
      '<div class="panel-head">' +
        '<div class="panel-card">' + faceOf(card) + '</div>' +
        '<div class="panel-meta">' +
          '<div class="card-name">' + (card.num ? card.num + ' · ' : '') + card.name + '<span class="en">' + card.en + '</span></div>' +
          '<div class="tags">' + tags + '</div>' +
          '<p class="meaning">' + card.meaning + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="split">' +
        '<div class="side up"><h4>✦ 正位</h4><p>' + card.up + '</p></div>' +
        '<div class="side rev"><h4>✦ 逆位</h4><p>' + card.rev + '</p></div>' +
      '</div>' +
      '<div class="aspects"><h4>✦ 各方运势解读</h4><div class="aspect-grid">' + aspects + '</div></div>' +
      '<div class="regen"><div class="date-line">' + (isDaily ? "☾ 今日签 · " : "🎲 娱乐抽 · ") + new Date().toLocaleString("zh-CN",{month:"long",day:"numeric",weekday:"long"}) + '</div></div>' +
    '</div>';
  reading.classList.add("show");
}

function showCard(card, isDaily){
  faceBox.innerHTML = faceOf(card);
  cardEl.classList.add("flipped");
  hint.textContent = isDaily ? ("今日指引 · " + card.name + " · " + card.en) : (card.name + " · " + card.en);
  btnAgain.style.display = "inline-block";
  buildReading(card, isDaily);
  reading.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function doDraw(isDaily){
  if(cardEl.classList.contains("flipped")){ cardEl.classList.remove("flipped"); reading.classList.remove("show"); }
  cardEl.classList.add("shake");
  setTimeout(function(){
    cardEl.classList.remove("shake");
    var card = pickCard();
    if(isDaily){ memStore[todayKey()] = String(card.id); persistNow(); }
    showCard(card, isDaily);
  }, 650);
}

cardEl.addEventListener("click", function(){
  var saved = memStore[todayKey()];
  if(saved != null){ return; }
  doDraw(true);
});
btnAgain.addEventListener("click", function(){ doDraw(false); });

function initDaily(){
  var saved = memStore[todayKey()];
  if(saved != null){
    var found = getDeck().find(function(c){ return c.id === Number(saved); }) || pickCard();
    faceBox.innerHTML = faceOf(found);
    cardEl.classList.add("flipped");
    hint.textContent = "今日已抽过啦 · " + found.name + " · " + found.en;
    btnAgain.style.display = "inline-block";
    buildReading(found, true);
  } else {
    faceBox.innerHTML = faceOf(getDeck()[0]);
  }
}
initDaily();
function applyLoaded(){
  if(memStore["mode"] === "major"){ MODE = "major"; }
  updateModeBtn();
  renderCodex();
  updateFooter();
  initDaily();
}
function loadWeb(){
  try {
    var raw = localStorage.getItem("yueying_mem");
    if(raw){ var d = JSON.parse(raw); if(d && typeof d === "object"){ for(var k in d){ memStore[k] = d[k]; } } }
  } catch(e){}
  applyLoaded();
}
window.addEventListener("pywebviewready", function(){
  if(window.pywebview && window.pywebview.api){
    window.pywebview.api.load().then(function(data){
      if(data && typeof data === "object"){
        for(var k in data){ memStore[k] = data[k]; }
      }
      applyLoaded();
    }).catch(function(){});
  }
});
if(!(window.pywebview && window.pywebview.api)){
  loadWeb();
}

function backSvg(){
  return '<svg viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="500" rx="20" fill="#3d2f66"/><rect x="10" y="10" width="280" height="480" rx="15" fill="none" stroke="#e0b96a" stroke-width="3"/><rect x="18" y="18" width="264" height="464" rx="12" fill="none" stroke="#e0b96a" stroke-width="1" opacity=".5"/><circle cx="150" cy="200" r="66" fill="none" stroke="rgba(224,185,106,.5)" stroke-width="2"/><text x="150" y="222" text-anchor="middle" font-size="72" fill="#e0b96a">☾</text><text x="150" y="292" text-anchor="middle" font-size="18" fill="#e8c9a0" letter-spacing="3">塔 罗</text></svg>';
}

function renderChips(){
  var box = document.getElementById("aspectChips");
  box.innerHTML = ASPECTS.map(function(a){ return '<div class="chip" data-key="' + a.key + '">' + a.icon + ' ' + a.name + '</div>'; }).join("");
  box.querySelectorAll(".chip").forEach(function(ch){
    ch.addEventListener("click", function(){
      selAspect = ch.dataset.key;
      box.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("sel"); });
      ch.classList.add("sel");
    });
  });
}

function renderSpreads(){
  var box = document.getElementById("spreadCards");
  box.innerHTML = SPREADS.map(function(s){ return '<div class="spread-card" data-id="' + s.id + '"><div class="s-name">' + s.name + '</div><div class="s-cards">' + s.cards + ' 张牌</div><div class="s-desc">' + s.desc + '</div></div>'; }).join("");
  box.querySelectorAll(".spread-card").forEach(function(sc){
    sc.addEventListener("click", function(){
      selSpread = sc.dataset.id;
      box.querySelectorAll(".spread-card").forEach(function(x){ x.classList.remove("sel"); });
      sc.classList.add("sel");
    });
  });
}

function aspectRead(card, aspectKey){
  if(aspectKey === "all"){ return card.up.replace(/^正位：/, ""); }
  return card.asp[aspectKey] || card.up.replace(/^正位：/, "");
}

function slotLine(card, reversed, aspectKey, slot){
  if(reversed){
    return "（逆位）" + card.rev.replace(/^逆位：/, "") + " 落在「" + slot.name + "」的位置，提醒：" + aspectRead(card, aspectKey);
  }
  return aspectRead(card, aspectKey);
}

function divineNow(){
  if(!selAspect || !selSpread){
    var btn = document.getElementById("btnDivine");
    btn.textContent = "请先选方面和牌阵哦";
    setTimeout(function(){ btn.textContent = "✨ 开始占卜"; }, 1300);
    return;
  }
  var spread = SPREADS.find(function(s){ return s.id === selSpread; });
  var aspect = ASPECTS.find(function(a){ return a.key === selAspect; });
  var pool = getDeck().slice();
  var drawn = [];
  for(var i=0;i<spread.cards;i++){
    var idx = Math.floor(Math.random()*pool.length);
    drawn.push({ card: pool.splice(idx,1)[0], reversed: Math.random() < 0.5 });
  }
  var result = document.getElementById("divineResult");
  var backs = spread.slots.map(function(s, i){ return '<div class="slot" id="slot' + i + '"><div class="slot-pos">' + (i+1) + ' · ' + s.name + '</div><div class="slot-card">' + backSvg() + '</div></div>'; }).join("");
  var cols = spread.cards === 1 ? "cols-1" : (spread.cards <= 5 ? "cols-3" : "cols-4");
  result.innerHTML = '<div class="divine-title">🔮 ' + aspect.icon + ' ' + aspect.name + ' · ' + spread.name + '</div><div class="slots-grid ' + cols + '">' + backs + '</div><div class="guide-box" id="guideBox" style="display:none">' + spread.guide + '</div>';
  result.scrollIntoView({behavior:"smooth", block:"start"});
  spread.slots.forEach(function(s, i){
    setTimeout(function(){
      var d = drawn[i];
      var el = document.getElementById("slot" + i);
      if(!el) return;
      el.innerHTML = '<div class="slot-pos">' + (i+1) + ' · ' + s.name + '</div>' +
        '<div class="slot-card' + (d.reversed ? ' reversed' : '') + '">' + faceOf(d.card) + '</div>' +
        '<div class="slot-name">' + d.card.name + (d.reversed ? '<span class="rev-tag">逆位</span>' : '<span class="rev-tag up">正位</span>') + '</div>' +
        '<div class="slot-read">' + slotLine(d.card, d.reversed, selAspect, s) + '</div>';
      if(i === spread.slots.length - 1){
        var g = document.getElementById("guideBox");
        if(g){ g.style.display = "block"; }
      }
    }, 500 + i * 650);
  });
}
